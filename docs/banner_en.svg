<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 440" width="1280" height="440" role="img" aria-label="Research Writing Prompts: copy-ready prompts and agent skills for research writing">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5F3FF"/>
      <stop offset="1" stop-color="#ECFEFF"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0891B2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#312E81" flood-opacity="0.14"/>
    </filter>
    <style>
      .zh { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans SC", "Hiragino Sans GB", sans-serif; }
      .en { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; }
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, "Microsoft YaHei", monospace; }
    </style>
  </defs>

  <rect x="0" y="0" width="1280" height="440" rx="28" fill="url(#bg)"/>
  <circle cx="1210" cy="40" r="140" fill="#C7D2FE" opacity="0.35"/>
  <circle cx="60" cy="430" r="120" fill="#A5F3FC" opacity="0.30"/>

  <!-- left: title -->
  <text x="72" y="92" class="en" font-size="20" font-weight="600" fill="#6366F1" letter-spacing="2">RESEARCH WRITING PROMPTS</text>
  <text x="72" y="160" class="en" font-size="52" font-weight="700" fill="#1E1B4B">Prompts for Papers</text>
  <rect x="72" y="182" width="120" height="6" rx="3" fill="url(#accent)"/>
  <text x="72" y="236" class="en" font-size="26" fill="#334155">Copy one, paste it into any LLM, done</text>
  <text x="72" y="276" class="en" font-size="19" fill="#64748B">Prompt texts are mostly in Chinese</text>

  <!-- stats -->
  <g class="zh">
    <rect x="72" y="306" width="150" height="62" rx="14" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="147" y="336" text-anchor="middle" font-size="26" font-weight="700" fill="#4F46E5" class="en">44</text>
    <text x="147" y="358" text-anchor="middle" font-size="15" fill="#475569" class="en">prompts</text>
    <rect x="236" y="306" width="150" height="62" rx="14" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="311" y="336" text-anchor="middle" font-size="26" font-weight="700" fill="#4F46E5" class="en">22</text>
    <text x="311" y="358" text-anchor="middle" font-size="15" fill="#475569" class="en">scenarios</text>
    <rect x="400" y="306" width="150" height="62" rx="14" fill="#FFFFFF" stroke="#E0E7FF"/>
    <text x="475" y="336" text-anchor="middle" font-size="26" font-weight="700" fill="#0891B2" class="en">8</text>
    <text x="475" y="358" text-anchor="middle" font-size="15" fill="#475569" class="en">agent skills</text>
  </g>
  <text x="72" y="404" class="en" font-size="15" fill="#64748B">Translate · Polish · De-AI · Shorten &amp; expand · Abstract to conclusion · Captions · Review</text>

  <!-- right: chat window -->
  <g filter="url(#shadow)">
    <rect x="700" y="52" width="512" height="336" rx="20" fill="#FFFFFF"/>
  </g>
  <rect x="700" y="52" width="512" height="44" rx="20" fill="#F8FAFC"/>
  <rect x="700" y="76" width="512" height="20" fill="#F8FAFC"/>
  <rect x="700.5" y="52.5" width="511" height="335" rx="20" fill="none" stroke="#DDE3F0"/>
  <line x1="700" y1="96" x2="1212" y2="96" stroke="#E2E8F0"/>
  <circle cx="726" cy="74" r="6" fill="#FCA5A5"/>
  <circle cx="746" cy="74" r="6" fill="#FCD34D"/>
  <circle cx="766" cy="74" r="6" fill="#86EFAC"/>
  <text x="956" y="80" text-anchor="middle" class="en" font-size="15" fill="#64748B">1.1 Chinese → English · primary</text>

  <!-- prompt block -->
  <rect x="724" y="114" width="464" height="138" rx="12" fill="#F1F5F9"/>
  <g class="mono" font-size="15">
    <text x="744" y="144" fill="#4F46E5">#&#160;Role</text>
    <text x="744" y="166" fill="#334155">顶尖科研写作专家 + 资深会议审稿人</text>
    <text x="744" y="194" fill="#4F46E5">#&#160;Task</text>
    <text x="744" y="216" fill="#334155">把中文草稿翻译并润色为英文论文段落</text>
    <text x="744" y="240" fill="#0891B2">[在此处粘贴你的中文草稿]</text>
  </g>
  <!-- copy button -->
  <rect x="1104" y="124" width="70" height="30" rx="8" fill="#FFFFFF" stroke="#C7D2FE"/>
  <rect x="1115" y="133" width="11" height="13" rx="2" fill="none" stroke="#4F46E5" stroke-width="1.6"/>
  <rect x="1119" y="130" width="11" height="13" rx="2" fill="#FFFFFF" stroke="#4F46E5" stroke-width="1.6"/>
  <text x="1135" y="145" class="en" font-size="13" fill="#4F46E5">Copy</text>

  <!-- arrow -->
  <path d="M956 258 L956 282" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M948 276 L956 286 L964 276" fill="none" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- output block -->
  <rect x="724" y="294" width="464" height="76" rx="12" fill="#EEF2FF"/>
  <g class="mono" font-size="14">
    <text x="744" y="322" fill="#312E81">Part 1  English paragraph, LaTeX-ready</text>
    <text x="744" y="350" fill="#312E81">Part 2  Chinese back-translation to check</text>
  </g>
</svg>
